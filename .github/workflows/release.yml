name: Release & Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Executable
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Standalone Executable
        run: |
          python scripts/build_exe.py --onefile

      - name: Prepare Release Archive
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "v0.1.0" }
          $zipName = "AMSO-Windows-${tag}.zip"
          Compress-Archive -Path dist/AMSO.exe, README*.md, LICENSE, CHANGELOG*.md, ROADMAP*.md, amso/locales -DestinationPath $zipName
          echo "ZIP_NAME=$zipName" >> $env:GITHUB_ENV

      - name: Extract Release Notes from CHANGELOG
        id: changelog_reader
        shell: python
        run: |
          import os
          import re
          from pathlib import Path

          tag = os.environ.get("GITHUB_REF_NAME", "").lstrip("v")
          changelog_path = Path("CHANGELOG.md")
          notes = ""

          if changelog_path.exists() and tag:
              content = changelog_path.read_text(encoding="utf-8")
              # Recherche de la section ## [X.Y.Z]
              pattern = rf"## \[{re.escape(tag)}\][^\n]*\n(.*?)(?=\n## \[|\Z)"
              match = re.search(pattern, content, re.DOTALL)
              if match:
                  notes = match.group(1).strip()

          if not notes:
              notes = "Consultez le fichier CHANGELOG.md pour le détail des modifications apportées dans cette version."

          # Écriture dans le fichier de sortie GitHub
          github_output = os.environ.get("GITHUB_OUTPUT")
          if github_output:
              with open(github_output, "a", encoding="utf-8") as f:
                  f.write(f"body<<EOF\n{notes}\nEOF\n")

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: AMSO ${{ github.ref_name }}
          body: ${{ steps.changelog_reader.outputs.body }}
          files: |
            ${{ env.ZIP_NAME }}
            dist/AMSO.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
