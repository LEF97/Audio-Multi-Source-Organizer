name: Tests CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  test:
    name: Test on ${{ matrix.os }} - Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Linux GUI & OpenGL dependencies (PySide6)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1 \
            libegl1 \
            libxkbcommon-x11-0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libxrandr2 \
            libpulse0 \
            libxcb-cursor0 \
            libpulse-mainloop-glib0 \
            xvfb
          # Qt Multimedia charge libpulse (et ALSA) des l'import : sans eux, les modules UI echouent a la collecte
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Verify i18n & Documentation Sync (5 languages)
        run: |
          python scripts/sync_translations.py --check-only
          python scripts/check_docs_sync.py


      - name: Run pytest (Linux with xvfb)
        if: runner.os == 'Linux'
        run: |
          xvfb-run --auto-servernum python -u -m pytest -v -o faulthandler_timeout=120

      - name: Run pytest (Windows & macOS)
        if: runner.os != 'Linux'
        run: |
          python -u -m pytest -v -o faulthandler_timeout=120
