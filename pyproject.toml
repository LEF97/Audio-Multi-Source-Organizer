[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "audio-multi-source-organizer"
version = "0.1.0"
description = "Unificateur, organisateur et synchroniseur de bibliothèques audio hybrides (local, Google Drive, Spotify)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [
    { name = "AMSO Team" }
]
keywords = ["audio", "music", "organizer", "spotify", "gdrive", "pyside6", "id3", "flac"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio",
]

dependencies = [
    "PySide6>=6.6.0",
    "mutagen>=1.47.0",
    "python-dotenv>=1.0.0",
    "spotipy>=2.23.0",
    "google-api-python-client>=2.110.0",
    "google-auth-oauthlib>=1.2.0",
    "google-auth-httplib2>=0.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
amso = "main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.setuptools.packages.find]
where = ["."]
include = ["amso*"]

[tool.setuptools.package-data]
amso = ["locales/*.json"]
