[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "audio-multi-source-organizer"
version = "0.4.1"
description = "Unificateur, organisateur et synchroniseur de bibliothèques audio hybrides (local, Google Drive, Spotify)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [
    { name = "AMSO Team" }
]
keywords = ["audio", "music", "organizer", "spotify", "gdrive", "pyside6", "id3", "flac"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio",
]

dependencies = [
    "PySide6>=6.6.0",
    "mutagen>=1.47.0",
    "python-dotenv>=1.0.0",
    "spotipy>=2.23.0",
    "google-api-python-client>=2.110.0",
    "google-auth-oauthlib>=1.2.0",
    "google-auth-httplib2>=0.2.0",
    "python-vlc>=3.0.20123",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.17.0",
    "mypy>=2.4.0",
    "radon>=6.0.1",
]

[project.scripts]
amso = "main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-q --tb=short -m \"not tnr\""
markers = ["tnr: non-régression des transitions sur pistes réelles (lent, hors suite par défaut ; pytest -m tnr)"]

[tool.setuptools.packages.find]
where = ["."]
include = ["amso*"]

[tool.setuptools.package-data]
amso = ["locales/*.json", "resources/*.*"]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["_work"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes (imports non utilisés, variables non définies)
    "I",   # isort (tri des imports)
    "UP",  # pyupgrade (idiomes Python modernes)
    "B",   # flake8-bugbear (bugs potentiels)
    "C4",  # flake8-comprehensions
    "T20", # flake8-print (pas de print, utiliser logging)
    "RUF100",  # noqa inutiles
]
ignore = [
    "E501",  # Longueur de ligne (les styles Qt et textes i18n sont souvent longs)
    "B008",  # Do not perform function call in argument defaults
]

[tool.ruff.lint.per-file-ignores]
"scripts/**" = ["T20"]
"scratch/**" = ["T20"]
"tests/**" = ["T20"]
"main.py" = ["T20"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
show_error_codes = true
