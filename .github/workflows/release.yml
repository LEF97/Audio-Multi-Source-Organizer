name: Release & Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Executable
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Verify Documentation & i18n Sync (43 languages)
        run: |
          python scripts/sync_translations.py --check-only
          python scripts/check_docs_sync.py --release


      - name: Build Standalone Executable
        run: |
          python scripts/build_exe.py --onefile

      - name: Prepare Release Archive
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_NAME -and $env:GITHUB_REF_NAME.StartsWith("v")) { $env:GITHUB_REF_NAME } else {
            $ver = (Get-Content amso/__init__.py | Select-String '__version__\s*=\s*["'']([^"'']+)["'']').Matches.Groups[1].Value.Trim()
            "v$ver"
          }
          $zipName = "AMSO-Windows-${tag}.zip"
          Compress-Archive -Path dist/AMSO.exe, README*.md, LICENSE, CHANGELOG*.md, ROADMAP*.md, amso/locales -DestinationPath $zipName
          echo "ZIP_NAME=$zipName" >> $env:GITHUB_ENV


      - name: Extract Release Notes from CHANGELOG
        id: changelog_reader
        shell: python
        run: |
          import os
          import re
          from pathlib import Path

          tag = os.environ.get("GITHUB_REF_NAME", "").lstrip("v")
          notes = ""

          # Vérifier en priorité CHANGELOG.fr.md puis CHANGELOG.md
          for filename in ["CHANGELOG.fr.md", "CHANGELOG.md"]:
              changelog_path = Path(filename)
              if changelog_path.exists() and tag:
                  content = changelog_path.read_text(encoding="utf-8")
                  pattern = rf"## \[{re.escape(tag)}\][^\n]*\n(.*?)(?=\n## \[|\Z)"
                  match = re.search(pattern, content, re.DOTALL)
                  if match and match.group(1).strip():
                      notes = match.group(1).strip()
                      break

          if not notes:
              notes = "Consultez le fichier CHANGELOG.fr.md pour le détail des modifications apportées dans cette version."

          github_output = os.environ.get("GITHUB_OUTPUT")
          if github_output:
              with open(github_output, "a", encoding="utf-8") as f:
                  f.write(f"body<<EOF\n{notes}\nEOF\n")

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: AMSO ${{ github.ref_name }}
          body: ${{ steps.changelog_reader.outputs.body }}
          files: |
            ${{ env.ZIP_NAME }}
            dist/AMSO.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Butler
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: remarkablegames/setup-butler@v1
        with:
          butler-version: LATEST

      - name: Deploy to Itch.io
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          if (-not $env:BUTLER_API_KEY) {
            Write-Host "Le secret BUTLER_API_KEY n'est pas configure dans GitHub Actions. Etape ignoree."
            exit 0
          }
          $cleanVersion = if ($env:GITHUB_REF_NAME -and $env:GITHUB_REF_NAME.StartsWith("v")) {
            $env:GITHUB_REF_NAME -replace '^v', ''
          } else {
            (Get-Content amso/__init__.py | Select-String '__version__\s*=\s*["'']([^"'']+)["'']').Matches.Groups[1].Value.Trim()
          }
          Write-Host "Deploiement de $env:ZIP_NAME vers itch.io (cible: arnaudlef97/amso:windows, version: $cleanVersion)..."
          butler push $env:ZIP_NAME arnaudlef97/amso:windows --userversion $cleanVersion


  build-linux:
    name: Build Linux (experimental, untested)
    needs: build-windows
    runs-on: ubuntu-22.04 # glibc plus ancienne : l'executable tourne aussi sur les distributions recentes

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon-x11-0 libpulse0 libpulse-mainloop-glib0 \
            libasound2 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xfixes0 libxcb-xinerama0 libxcb-cursor0 libxrandr2 libfuse2

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build (PyInstaller, onedir)
        run: python scripts/build_exe.py

      - name: Download appimagetool
        run: |
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool

      - name: Package (.tar.gz and .AppImage)
        run: python scripts/package_unix.py --appimagetool ./appimagetool

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AMSO-Linux
          path: |
            dist/AMSO-Linux-*.tar.gz
            dist/AMSO-Linux-*.AppImage

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/AMSO-Linux-*.tar.gz
            dist/AMSO-Linux-*.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    name: Build macOS ${{ matrix.arch }} (experimental, untested, unsigned)
    needs: build-windows
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15 # Apple Silicon
            arch: arm64
          - os: macos-15-intel # Intel
            arch: x86_64
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build (PyInstaller, .app bundle)
        run: python scripts/build_exe.py

      - name: Package (.dmg)
        run: python scripts/package_unix.py

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AMSO-macOS-${{ matrix.arch }}
          path: dist/AMSO-macOS-*.dmg

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/AMSO-macOS-*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
